# Netlify configuration for the Jobetes web app.
# Build runs from the monorepo root; output comes from apps/web/dist.

[build]
  base = "."
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jobetes/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.32.1"

# SPA — every unknown URL serves index.html so the client router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Strict security headers — see compliance/ISO_27001_ANNEX_A_MAPPING.md (A.8.20).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.annahospital.de; connect-src 'self' https://api.jobetes.health https://generativelanguage.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
