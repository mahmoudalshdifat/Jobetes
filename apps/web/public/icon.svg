<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brand-primary background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#1B4D7A"/>
  <!-- Brand-secondary accent corner -->
  <path d="M 0 0 L 200 0 L 0 200 Z" fill="#2C8C9E" opacity="0.18"/>
  <!-- Stylized "J" + caduceus dot -->
  <path d="M 256 96
           L 256 320
           Q 256 392 184 392
           Q 128 392 112 344"
        fill="none" stroke="#F8F4EE" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar (top) -->
  <line x1="200" y1="120" x2="312" y2="120" stroke="#F8F4EE" stroke-width="44" stroke-linecap="round"/>
  <!-- Trust dot -->
  <circle cx="384" cy="128" r="32" fill="#6B7F4E"/>
  <text x="384" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700"
        text-anchor="middle" dominant-baseline="middle" fill="#F8F4EE">+</text>
</svg>
