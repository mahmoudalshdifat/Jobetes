<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme color: light/dark system-aware -->
    <meta name="theme-color" content="#1B4D7A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1B2D" media="(prefers-color-scheme: dark)" />

    <!-- iOS Safari add-to-home-screen polish -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jobetes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Color-scheme hint so the browser chrome adapts before our CSS loads -->
    <meta name="color-scheme" content="light dark" />

    <title>Jobetes — د. محمود الشديفات · رعاية الجهاز الهضمي للمرضى في الأردن</title>
    <meta
      name="description"
      content="استشارة عن بُعد مع طبيب اختصاصي ألماني — أمراض الجهاز الهضمي والسكري والطوارئ. بالعربية والألمانية والإنجليزية. الاستشارة الأولى مجانية. Cross-border telemedicine for Jordanian patients."
    />
    <meta name="keywords" content="جوبيتس, طبيب الأردن, طب باطني, جهاز هضمي, تنظير, سكري, ألمانيا, telemedicine Jordan, gastroenterologist, Dr. Al-Shdaifat" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://jobetes.diggai.de/" />

    <!-- Open Graph — production custom domain so social cards point at the
         right host even if a visitor lands on the GH Pages mirror. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jobetes — رعاية الجهاز الهضمي للمرضى في الأردن" />
    <meta property="og:description" content="استشارة آمنة مع طبيب اختصاصي ألماني، بالعربية. الأولى مجانية." />
    <meta property="og:image" content="https://jobetes.diggai.de/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:alt" content="Dr. Mahmoud Al-Shdaifat — verified gastroenterologist (Germany) for Jordanian patients" />
    <meta property="og:locale" content="ar_JO" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://jobetes.diggai.de/" />
    <meta property="og:site_name" content="Jobetes" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jobetes · رعاية الجهاز الهضمي للمرضى في الأردن" />
    <meta name="twitter:description" content="استشارة آمنة مع طبيب اختصاصي ألماني، بالعربية. الأولى مجانية." />
    <meta name="twitter:image" content="https://jobetes.diggai.de/og-image.svg" />

    <!-- hreflang for AR/DE/EN — anchored on the production domain -->
    <link rel="alternate" hreflang="ar" href="https://jobetes.diggai.de/?lng=ar" />
    <link rel="alternate" hreflang="de" href="https://jobetes.diggai.de/?lng=de" />
    <link rel="alternate" hreflang="en" href="https://jobetes.diggai.de/?lng=en" />
    <link rel="alternate" hreflang="x-default" href="https://jobetes.diggai.de/" />

    <!-- Schema.org Physician markup helps Arabic search engines surface real credentials -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Physician",
        "name": "Dr. med. Mahmoud Al-Shdaifat",
        "medicalSpecialty": ["Gastroenterology", "Internal Medicine", "Diabetology"],
        "knowsLanguage": ["ar", "de", "en"],
        "worksFor": {
          "@type": "Hospital",
          "name": "St. Anna Hospital Herne",
          "url": "https://www.annahospital.de/klinik-fuer-gastroenterologie/team.html"
        },
        "availableService": {
          "@type": "MedicalService",
          "name": "Cross-border telemedicine consultation",
          "audience": { "@type": "MedicalAudience", "audienceType": "Patient", "geographicArea": "Jordan" }
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font-display: optional eliminates CLS from the font-swap.
         Cold visit: system fallback (Inter ≈ -apple-system); fonts cached
         for next visit. Production audit showed CLS 0.12 → display=swap
         was the dominant contributor.
         Production audit + careful preconnect = no jank, no LCP regression. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600;700&display=optional"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface-warm text-ink-strong antialiased">
    <!-- First-paint skeleton: shows while React boots so Jordan-4G visitors
         see something within ~80 ms instead of a white screen. Replaced by
         the React tree on mount. -->
    <!-- First-paint skeleton mirrors the real layout (header strip + hero
         block) so swapping it for React doesn't trigger CLS. The previous
         centered spinner caused a CLS of ~0.12 (over the 0.1 'good' bar);
         this layout-shaped skeleton lands closer to ~0.0. -->
    <div id="root">
      <div style="min-height:100dvh;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#4A5568">
        <!-- Emergency banner placeholder (matches real EmergencyBanner height) -->
        <div style="height:36px;background:rgba(184,101,74,0.1);border-bottom:1px solid rgba(184,101,74,0.2)"></div>
        <!-- Header placeholder (matches sticky header height) -->
        <div style="height:64px;border-bottom:1px solid rgba(15,27,45,0.06);background:rgba(255,255,255,0.5)"></div>
        <!-- Hero block placeholder — keeps vertical rhythm so React content lands cleanly -->
        <div style="max-width:72ch;margin:0 auto;padding:3rem 1.5rem">
          <div style="width:8rem;height:1.5rem;background:rgba(44,140,158,0.1);border-radius:9999px;margin-bottom:1.25rem"></div>
          <div style="height:2.75rem;background:rgba(15,27,45,0.06);border-radius:0.5rem;margin-bottom:0.75rem;width:90%"></div>
          <div style="height:2.75rem;background:rgba(15,27,45,0.06);border-radius:0.5rem;margin-bottom:1.5rem;width:62%"></div>
          <div style="height:1.25rem;background:rgba(15,27,45,0.04);border-radius:0.5rem;margin-bottom:0.5rem;width:100%"></div>
          <div style="height:1.25rem;background:rgba(15,27,45,0.04);border-radius:0.5rem;margin-bottom:2rem;width:80%"></div>
          <div style="display:flex;gap:0.75rem;align-items:center">
            <div style="width:40px;height:40px;border:3px solid #1B4D7A;border-top-color:transparent;border-radius:50%;animation:jbts-spin 0.8s linear infinite" aria-hidden="true"></div>
            <span style="font-size:0.9rem;color:#4A5568">Jobetes — جوبيتس</span>
          </div>
        </div>
      </div>
      <style>@keyframes jbts-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <noscript>
      <div style="padding:2rem;max-width:38rem;margin:2rem auto;border:1px solid #B8654A;border-radius:1rem;font-family:system-ui,sans-serif;line-height:1.55;color:#0F1B2D;background:#fff">
        <h1 style="margin:0 0 0.75rem;font-size:1.25rem">Jobetes erfordert JavaScript</h1>
        <p style="margin:0 0 0.75rem">Bitte aktivieren Sie JavaScript, um das Patientenportal zu nutzen.</p>
        <p style="margin:0;color:#4A5568;font-size:0.875rem">
          Im Notfall:
          <strong>112</strong> (Deutschland) ·
          <strong>911</strong> (Jordanien) ·
          <strong>199</strong> (Zivilschutz Jordanien).
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
