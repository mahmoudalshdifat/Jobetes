# Fly.io configuration for the Jobetes API — STAGING environment.
# Region `fra` (Frankfurt) — mirrors production for EU data residency.
# Smaller VM, auto-stop enabled to minimize cost.

app = "jobetes-api-staging"
primary_region = "fra"

[build]
  dockerfile = "../infrastructure/Dockerfile.api"
  build-target = "runtime"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "staging"
  LOG_LEVEL = "debug"
  CORS_ORIGIN = "https://staging.jobetes.diggai.de,http://localhost:5173,http://localhost:4173"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # scale to zero when idle (cost optimisation)
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
