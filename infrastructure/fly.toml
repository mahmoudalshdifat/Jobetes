# Fly.io configuration for the Jobetes API.
# Region `fra` (Frankfurt) — keeps EU-resident processing.
# Reference: https://fly.io/docs/reference/configuration/

app = "jobetes-api"
primary_region = "fra"

[build]
  dockerfile = "../infrastructure/Dockerfile.api"
  build-target = "runtime"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  CORS_ORIGIN = "https://jobetes.health,https://www.jobetes.health"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
