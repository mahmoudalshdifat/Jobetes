name: lighthouse

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/i18n/**'
      - 'apps/web/lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @jobetes/web build
      - name: Run Lighthouse CI
        # cd into apps/web so `staticDistDir: "dist"` in lighthouserc.json
        # resolves to apps/web/dist (not the non-existent <root>/dist).
        working-directory: apps/web
        run: |
          pnpm dlx @lhci/cli@0.14.x autorun \
            --config=lighthouserc.json \
            --upload.target=temporary-public-storage
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          retention-days: 7
