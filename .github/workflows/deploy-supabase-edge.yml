name: deploy-supabase-edge

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Public/Protected Edge Functions
        run: |
          supabase functions deploy health doctor-profile intake triage notify-patient \
            --project-ref kzzihkwkhnnoixgogxzj
      - name: Deploy admin-summary (anon-key compatibility mode)
        run: |
          supabase functions deploy admin-summary \
            --project-ref kzzihkwkhnnoixgogxzj \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
