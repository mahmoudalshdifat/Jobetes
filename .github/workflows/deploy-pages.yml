name: deploy-pages

# FREE web hosting via GitHub Pages. Custom domain: jobetes.diggai.de
# Publishes 3 apps to one Pages site:
#   /             → patient web (apps/web)
#   /doctor/      → doctor portal (apps/doctor)
#   /admin/       → admin console (apps/admin)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/doctor/**'
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VITE_API_URL: https://kzzihkwkhnnoixgogxzj.supabase.co/functions/v1
  VITE_SUPABASE_URL: https://kzzihkwkhnnoixgogxzj.supabase.co

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile=false

      - name: Build patient web (root)
        run: pnpm --filter @jobetes/web build
        env:
          VITE_BASE: /
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Source-map upload only fires when all 3 are set; plugin no-ops otherwise
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Build doctor portal (subpath)
        run: pnpm --filter @jobetes/doctor build
        env:
          VITE_BASE: /doctor/
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build admin console (subpath)
        run: pnpm --filter @jobetes/admin build
        env:
          VITE_BASE: /admin/
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Compose Pages output (web + /doctor + /admin)
        run: |
          rm -rf _site
          mkdir -p _site/doctor _site/admin
          cp -R apps/web/dist/.    _site/
          cp -R apps/doctor/dist/. _site/doctor/
          cp -R apps/admin/dist/.  _site/admin/
          # 404.html for SPA routing at each level
          cp _site/index.html _site/404.html
          cp _site/doctor/index.html _site/doctor/404.html
          cp _site/admin/index.html  _site/admin/404.html
          echo "jobetes.diggai.de" > _site/CNAME

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
