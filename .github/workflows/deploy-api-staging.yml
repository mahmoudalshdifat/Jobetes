name: deploy-api-staging

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-api-staging.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FLY_STAGING_APP_NAME != '' }}
    timeout-minutes: 15
    concurrency:
      group: fly-deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to staging
        run: flyctl deploy --config infrastructure/fly.staging.toml --app ${{ vars.FLY_STAGING_APP_NAME }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test staging health endpoint
        run: |
          echo "Waiting for staging to warm up..."
          sleep 15
          curl -sf https://${{ vars.FLY_STAGING_APP_NAME }}.fly.dev/health || exit 1
          echo "Staging health check passed."
